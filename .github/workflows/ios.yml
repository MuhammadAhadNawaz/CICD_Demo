name: iOS CI/CD (Xcode 26)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14
  env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Select Xcode 26
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app

      # 3. Show Xcode version (debug)
      - name: Xcode version
        run: xcodebuild -version

      # 4. Install Ruby & Fastlane
      - name: Install Fastlane
        run: |
          sudo gem install fastlane -NV

      # 5. Install Transporter (required for uploads)
      - name: Install Transporter
        run: brew install --cask transporter

      # 6. Verify Transporter installation
      - name: Verify Transporter
        run: |
          echo "Listing Transporter binaries..."
          ls /Applications/Transporter.app/Contents/itms/bin/

          echo "Checking version..."
          /Applications/Transporter.app/Contents/itms/bin/iTMSTransporter -version

      # 7. Set Transporter path for Fastlane
      - name: Set Transporter path
        run: |
          echo "FASTLANE_ITUNES_TRANSPORTER_PATH=/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter" >> $GITHUB_ENV

      # 8. Debug transporter path
      - name: Debug transporter path
        run: echo $FASTLANE_ITUNES_TRANSPORTER_PATH

      # 9. Resolve Swift Packages (if using SPM)
      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies

      # 10. Run Fastlane (build + upload)
      - name: Build & Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: fastlane beta --verbose
