name: iOS CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Select Xcode (safe default for GitHub runners)
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # 3. Show Xcode version
      - name: Xcode version
        run: xcodebuild -version

      # 4. Install Fastlane
      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      # 5. Install Transporter
      - name: Install Transporter
        run: brew install --cask transporter

      # 6. Verify Transporter
      - name: Verify Transporter
        run: |
          ls /Applications/Transporter.app/Contents/itms/bin/
          /Applications/Transporter.app/Contents/itms/bin/iTMSTransporter -version

      # 7. Set Transporter path for Fastlane
      - name: Set Transporter path
        run: echo "FASTLANE_ITUNES_TRANSPORTER_PATH=/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter" >> $GITHUB_ENV

      # 8. Debug Transporter path
      - name: Debug Transporter path
        run: echo $FASTLANE_ITUNES_TRANSPORTER_PATH

      # 9. Resolve Swift dependencies (SPM)
      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies

      # 10. Build & Upload to TestFlight
      - name: Build & Upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: fastlane beta --verbose
