name: iOS CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      # DEBUG: show installed Xcodes
      - name: List Xcode versions
        run: ls /Applications

      # SELECT correct Xcode
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Verify Xcode
        run: xcodebuild -version

      # Install Fastlane
      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      # FIXED: correct transporter package
      - name: Install Transporter
        run: brew install --cask transfer

      - name: Verify Transporter
        run: |
          ls /Applications/Transfer.app/Contents/itms/bin/
          /Applications/Transfer.app/Contents/itms/bin/iTMSTransporter -version

      - name: Set Transporter Path
        run: echo "FASTLANE_ITUNES_TRANSPORTER_PATH=/Applications/Transfer.app/Contents/itms/bin/iTMSTransporter" >> $GITHUB_ENV

      - name: Build & Upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: fastlane beta --verbose
