name: iOS CI/CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-14

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Debug: List installed Xcode versions
      - name: List Xcode versions
        run: ls /Applications

      # 3. Select default Xcode (safe)
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      # 4. Verify Xcode version
      - name: Verify Xcode
        run: xcodebuild -version

      # 5. Check if Apple transporter CLI exists (optional debug)
      - name: Check iTMSTransporter
        run: |
          xcrun iTMSTransporter -version || echo "iTMSTransporter not available via xcrun"

      # 6. Install Fastlane
      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      # 7. Resolve Swift Package dependencies
      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies

      # 8. Build & Upload to TestFlight
      - name: Build & Upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
        run: fastlane beta --verbose
